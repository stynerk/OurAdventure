<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6efdc">
<title>우리 가족 경주 탐험대</title>
<style>
:root{--paper:#f6efdc;--card:#fffaf0;--ink:#2e332c;--muted:#6f746c;--line:#d7c7a6;--moss:#3f6754;--sun:#e1a642;--night:#33405e;--rose:#b45f5f}
*{box-sizing:border-box}html{background:#e8e0cf}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}
.wrap{max-width:430px;margin:0 auto;min-height:100svh;background:var(--card);box-shadow:0 0 50px #0002;padding-bottom:88px}.top{position:sticky;top:0;z-index:20;padding:12px 16px;background:#fffaf0ee;border-bottom:1px solid var(--line);backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center}.top strong{font-family:Georgia,"Noto Serif KR",serif}.ghost{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 10px;font-size:12px}
.screen{display:none;padding:16px 16px 30px}.screen.on{display:block}.hero{padding:22px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,#fffaf0,#f1e7ce);box-shadow:0 10px 30px #46321418}.hero h1{font-family:Georgia,"Noto Serif KR",serif;font-size:30px;line-height:1.2;margin:8px 0}.hero p{font-size:14px;color:var(--muted);line-height:1.55}.kicker{font-size:11px;font-weight:900;color:var(--moss);letter-spacing:.08em}.progress{height:12px;background:#e3d7bc;border-radius:999px;overflow:hidden;margin-top:10px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#c87540)}
.section{display:flex;justify-content:space-between;align-items:end;margin:24px 2px 10px}.section h2{font-family:Georgia,"Noto Serif KR",serif;font-size:20px;margin:0}.section small{color:var(--muted)}
.map{height:430px;position:relative;border:1px dashed #798a6a66;border-radius:26px;background:radial-gradient(circle at 15% 15%,#688c6b18 0 50px,transparent 51px),radial-gradient(circle at 80% 70%,#688c6b18 0 70px,transparent 71px),linear-gradient(135deg,#f7efd7,#eadcb8);overflow:hidden}.map:before{content:"";position:absolute;left:14%;right:12%;top:12%;bottom:8%;border:4px dotted #897d6188;border-left-color:transparent;border-radius:48% 42% 55% 38%;transform:rotate(8deg)}
.node{position:absolute;width:110px;min-height:96px;transform:translate(-50%,-50%);padding:8px;border-radius:22px;text-align:center;touch-action:manipulation}.node:active{background:#3f675414}.pin{width:58px;height:58px;margin:auto;border-radius:18px 18px 22px 22px;border:2px solid #6c8069;background:#fffaf2;display:grid;place-items:center;font-size:28px;box-shadow:0 6px 0 #554a3118}.node.done .pin{background:#e4efdf}.node.done .pin:after{content:"✓";position:absolute;margin-left:48px;margin-top:-54px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--moss);color:white;border:2px solid white;font-size:12px}.node b{display:block;font-size:11px;margin-top:5px}.n1{left:22%;top:15%}.n2{left:72%;top:22%}.n3{left:33%;top:42%}.n4{left:77%;top:48%}.n5{left:60%;top:67%}.n6{left:23%;top:73%}.n7{left:48%;top:88%}
.quest{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:22px;background:#fff;margin-bottom:10px}.quest .ico{width:54px;height:54px;border-radius:17px;background:#efe4c8;display:grid;place-items:center;font-size:27px}.quest h3{font-size:14px;margin:0 0 4px}.quest p{font-size:11px;color:var(--muted);margin:0}.quest .go{font-size:11px;font-weight:900;color:var(--moss)}
.chapter{border:1px solid var(--line);border-radius:26px;overflow:hidden;background:#fff;margin-bottom:14px;box-shadow:0 8px 20px #46321410}.chapter img{width:100%;height:190px;object-fit:cover;display:block}.chapter .body{padding:15px}.chapter h3{font-family:Georgia,"Noto Serif KR",serif;font-size:22px;margin:5px 0}.chapter p{font-size:12px;color:var(--muted);line-height:1.5}.cta,.secondary,.camera{display:block;width:100%;border-radius:16px;padding:14px;font-weight:900;text-align:center;margin-top:8px}.cta{border:0;background:var(--moss);color:white}.secondary{border:1px solid var(--line);background:transparent;color:var(--ink)}.camera{background:var(--night);color:white}.cameraInput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.stamps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stamp{aspect-ratio:1;border:2px dashed #c6b38c;border-radius:22px;display:grid;place-items:center;text-align:center;background:#f8f0dc}.stamp.done{border-style:solid;background:#edf4ea}.stamp .e{font-size:42px;filter:grayscale(1);opacity:.25}.stamp.done .e{filter:none;opacity:1;transform:rotate(-8deg)}.stamp b{display:block;font-size:12px;margin-top:7px}
.memory{padding:15px;border:1px solid var(--line);border-radius:22px;background:white;margin-bottom:12px}.memory img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;margin-top:10px}.memory h3{margin:5px 0;font-size:16px}.memory p{font-size:12px;color:var(--muted);line-height:1.5}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#fffaf0f2;border-top:1px solid var(--line);backdrop-filter:blur(10px);z-index:30}.nav button{border:0;background:transparent;border-radius:14px;padding:8px 3px;font-size:11px;color:#777}.nav b{display:block;font-size:20px}.nav button.active{background:#e8efe5;color:var(--moss);font-weight:900}
.onboarding{max-width:430px;min-height:100svh;margin:0 auto;display:grid;align-content:center;padding:24px 20px;background:linear-gradient(#e9e0c5,#fff8e9)}.book{padding:28px 22px;border:2px solid #bfa77c;border-radius:32px;background:#fffaf0;box-shadow:0 18px 0 #d7c29a,0 30px 60px #3d2d141e;text-align:center}.book .cover{font-size:68px}.book h1{font-family:Georgia,"Noto Serif KR",serif;font-size:30px;line-height:1.2}.book p{font-size:13px;color:var(--muted);line-height:1.55}.name{display:flex;gap:8px;margin-top:18px}.name input{min-width:0;flex:1;border:1px solid #cdbb98;border-radius:14px;padding:13px}.name button{border:0;background:var(--moss);color:white;border-radius:14px;padding:0 16px;font-weight:900}
.overlay{position:fixed;inset:0;background:#26241d99;display:none;place-items:end center;padding:16px;z-index:60}.overlay.show{display:grid}.modal{width:min(430px,100%);max-height:88svh;overflow:auto;background:var(--card);border-radius:30px 30px 22px 22px;padding:22px}.modal h2{font-family:Georgia,"Noto Serif KR",serif;margin:8px 0}.modal p{font-size:13px;color:var(--muted);line-height:1.55}.mission,.shot{padding:14px;border:1px solid #ddccaa;border-radius:18px;background:#f1e8d3;margin:14px 0;font-size:14px;line-height:1.55}.shot{background:#edf2e8;border-color:#c7d6c4}.real{border:1px solid #ddccaa;border-radius:20px;overflow:hidden;background:#fff;margin:12px 0}.real img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.real .cap{padding:11px 13px;font-size:11px;color:var(--muted);line-height:1.45}.preview{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;margin-top:10px}.seal{width:150px;height:150px;margin:10px auto;border:7px double var(--rose);border-radius:50%;display:grid;place-items:center;font-size:58px;transform:rotate(-10deg)}.center{text-align:center}.tiny{font-size:11px;color:var(--muted)}
@media(min-width:700px){body{padding:24px 0}.wrap,.onboarding{border-radius:30px;overflow:hidden;min-height:860px}.nav{bottom:24px;border-radius:0 0 30px 30px}}
</style>
</head>
<body>
<section id="onboarding" class="onboarding">
 <div class="book"><div class="cover">🏯</div><div class="kicker">GYEONGJU FAMILY QUEST</div><h1>우리 탐험대의<br>이름을 지어줘!</h1><p>동화책 지도를 따라 신라의 일곱 인장을 찾아가는 3일 원정이야.</p><div class="name"><input id="teamInput" maxlength="14" placeholder="예: 별빛 탐험대"><button onclick="start()">시작</button></div></div>
</section>
<div id="app" class="wrap" hidden>
 <header class="top"><div><div class="tiny">2026.10.09 — 10.11</div><strong id="brand"></strong></div><button class="ghost" onclick="resetAll()">처음부터</button></header>
 <main>
  <section id="home" class="screen on">
   <div class="hero"><div class="kicker">WELCOME, <span class="team"></span></div><h1>신라의 일곱 인장을<br>찾으러 가자!</h1><p>동화 지도에서 장소를 누르면 오늘의 미션이 열려. 사진을 찍고 스탬프를 모아 우리 가족 원정기를 완성해보자.</p><div class="tiny" style="margin-top:15px">원정 진행도 <b id="progressText">0 / 7</b></div><div class="progress"><span id="bar"></span></div></div>
   <div class="section"><h2>이야기 지도</h2><small>아이콘 전체를 눌러봐</small></div>
   <div class="map" id="map"></div>
   <div class="section"><h2>다음 Quest</h2><small id="left"></small></div><div id="next"></div>
  </section>
  <section id="route" class="screen"><div class="section"><h2>3일의 이야기</h2><small>챕터 카드 전체 터치</small></div><div id="chapters"></div></section>
  <section id="stamps" class="screen"><div class="section"><h2>스탬프북</h2><small id="stampMeta"></small></div><div class="stamps" id="stampGrid"></div></section>
  <section id="memory" class="screen"><div class="section"><h2>우리 가족 원정기</h2><small>사진 + 완료 기록</small></div><div id="memoryList"></div></section>
 </main>
 <nav class="nav"><button data-s="home" onclick="go('home')"><b>🗺️</b>지도</button><button data-s="route" onclick="go('route')"><b>📖</b>코스</button><button data-s="stamps" onclick="go('stamps')"><b>🔴</b>스탬프</button><button data-s="memory" onclick="go('memory')"><b>✨</b>기록</button></nav>
</div>
<div id="questOverlay" class="overlay" onclick="if(event.target===this)closeQuest()"><div id="questModal" class="modal"></div></div>
<div id="stampOverlay" class="overlay"><div id="stampModal" class="modal"></div></div>
<script>
var quests=[
{id:"eupseong",day:1,order:1,icon:"🛡️",place:"경주읍성",title:"성문 수호대의 첫 인장",mission:"성벽을 따라 걸으며 문처럼 열려 있는 곳 또는 성을 지키는 구조 하나를 찾아보자.",shot:"성벽이나 문이 보이게 서서 ‘수호대 포즈’로 한 장!",stamp:"성문 수호대",memory:"경주읍성에서 첫 번째 탐험 도장을 얻었다.",photo:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Gyeongjueupseong%20Town%20Wall%20Site.jpg?width=1200"},
{id:"daereungwon",day:1,order:2,icon:"👑",place:"대릉원",title:"왕의 언덕에는 누가 잠들어 있을까?",mission:"큰 무덤과 작은 무덤을 찾아보고 우리 탐험대가 가장 크다고 생각하는 무덤 하나를 골라보자.",shot:"가장 마음에 든 봉분을 배경으로 손으로 왕관 모양 만들기.",stamp:"왕의 언덕",memory:"초록 언덕 사이에서 신라 왕들의 흔적을 찾았다.",photo:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Daereungwon%20Tomb%20Complex.jpg?width=1200"},
{id:"bulguksa",day:2,order:3,icon:"🛕",place:"불국사",title:"서로 다른 두 탑의 비밀",mission:"석가탑과 다보탑을 찾아 더 단순해 보이는 탑과 더 장식이 많아 보이는 탑을 가족에게 설명해 보자.",shot:"더 마음에 드는 탑을 가리키며 ‘내 선택!’ 포즈.",stamp:"두 탑의 비밀",memory:"닮지 않은 두 탑을 자세히 비교했다.",photo:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Daeungjeon%2C%20Seokgatap%20and%20Dabotap.jpg?width=1200"},
{id:"museum",day:2,order:4,icon:"🏺",place:"국립경주박물관",title:"사라진 신라 황금빛을 찾아라",mission:"전시실에서 금빛으로 반짝이는 신라 유물 하나를 골라 가장 마음에 든 이유를 한 문장으로 말해보자.",shot:"촬영 가능한 유물이라면 전시와 함께, 어렵다면 박물관 밖에서 ‘보물 발견!’ 포즈.",stamp:"신라 보물",memory:"박물관에서 마음에 드는 신라 보물 하나를 골랐다.",photo:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Gyeongju%20National%20Museum.jpg?width=1200"},
{id:"donggung",day:2,order:5,icon:"🌙",place:"동궁과 월지",title:"달이 두 개 뜨는 궁전",mission:"연못에 비친 건물이나 불빛을 찾아 진짜 건물과 물속 건물이 함께 보이는 장면을 찾아보자.",shot:"건물과 연못 속 반영이 한 화면에 같이 들어오게 찍기.",stamp:"달빛 궁전",memory:"물 위와 물속에서 두 개의 궁전을 보았다.",photo:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Donggung%20Palace%20%26%20Wolji%20Pond%2C%20Gyeongju%20-%20Donggung2691.jpg?width=1200"},
{id:"cheomseongdae",day:3,order:6,icon:"⭐",place:"첨성대",title:"별 관찰자의 창",mission:"첨성대 가운데의 네모난 창을 찾아보자. 찾으면 손으로 네모 프레임을 만들어보자.",shot:"손가락 네모 프레임 안에 첨성대 창을 넣어 찍기.",stamp:"별 관찰자",memory:"첨성대의 네모난 창을 찾아냈다.",photo:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Cheomseongdae%2C%20Gyeongju.jpg?width=1200"},
{id:"woljeonggyo",day:3,order:7,icon:"🌉",place:"월정교",title:"마지막 다리를 건너라",mission:"가족 모두 함께 월정교를 건너고 다리 위 또는 다리가 보이는 곳에서 손가락으로 7을 만들어보자.",shot:"월정교 전체가 보이는 곳에서 가족이 함께 손가락 7 포즈!",stamp:"완주의 다리",memory:"마지막 다리를 건너 경주 탐험을 완성했다.",photo:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Illuminated%20Woljeonggyo%20Bridge%20at%20blue%20hour%20in%20Gyeongju%20South%20Korea.jpg?width=1200"}
];
var chapterInfo=[
{title:"왕의 도시로 들어가라",date:"10월 9일",sub:"첫날은 가볍게 게임 규칙을 익히는 날",img:quests[1].photo},
{title:"사라진 신라의 빛을 찾아라",date:"10월 10일",sub:"불국사부터 달빛 궁전까지 메인 어드벤처",img:quests[4].photo},
{title:"별과 다리를 건너라",date:"10월 11일",sub:"별을 찾고 마지막 인장을 완성하는 엔딩",img:quests[5].photo}
];
var state={team:"",done:[],photos:{}};
try{state=JSON.parse(localStorage.getItem("gj-family-quest"))||state}catch(e){}
state.done=Array.isArray(state.done)?state.done:[];state.photos=state.photos||{};
function save(){try{localStorage.setItem("gj-family-quest",JSON.stringify(state))}catch(e){alert("사진 저장 공간이 부족해. 사진을 줄인 뒤 다시 시도해줘.")}}
function start(){var n=document.getElementById("teamInput").value.trim();if(n.length<2){alert("탐험대 이름을 두 글자 이상 지어줘!");return}state.team=n;save();document.getElementById("onboarding").hidden=true;document.getElementById("app").hidden=false;render();go("home")}
function resetAll(){if(confirm("탐험대 이름과 모든 스탬프, 사진을 지울까?")){localStorage.removeItem("gj-family-quest");location.reload()}}
function go(id){document.querySelectorAll(".screen").forEach(function(x){x.classList.remove("on")});document.getElementById(id).classList.add("on");document.querySelectorAll(".nav button").forEach(function(x){x.classList.toggle("active",x.getAttribute("data-s")===id)});scrollTo(0,0)}
function render(){
 document.getElementById("brand").textContent=state.team;document.querySelectorAll(".team").forEach(function(x){x.textContent=state.team});
 var c=state.done.length;document.getElementById("progressText").textContent=c+" / 7";document.getElementById("bar").style.width=(c/7*100)+"%";document.getElementById("left").textContent=c===7?"모두 완료!":(7-c)+"개 남음";document.getElementById("stampMeta").textContent=c+" / 7";
 var pos=["n1","n2","n3","n4","n5","n6","n7"];document.getElementById("map").innerHTML=quests.map(function(q,i){return '<div class="node '+pos[i]+' '+(state.done.indexOf(q.id)>=0?"done":"")+'" role="button" tabindex="0" onclick="openQuest(\''+q.id+'\')"><div class="pin">'+q.icon+'</div><b>'+q.place+'</b></div>'}).join("");
 var n=quests.find(function(q){return state.done.indexOf(q.id)<0});document.getElementById("next").innerHTML=n?questCard(n):'<div class="hero center"><div style="font-size:58px">🏆</div><h1>'+safe(state.team)+' 원정 완료!</h1><p>일곱 인장을 모두 찾았어. 기록 탭에서 우리 사진을 다시 보자.</p></div>';
 document.getElementById("chapters").innerHTML=chapterInfo.map(function(ch,i){return '<article class="chapter" onclick="showChapter('+(i+1)+')"><img src="'+ch.img+'" loading="lazy"><div class="body"><div class="kicker">CHAPTER '+(i+1)+' · '+ch.date+'</div><h3>'+ch.title+'</h3><p>'+ch.sub+' · Quest '+quests.filter(function(q){return q.day===i+1}).length+'개</p><button class="cta">Chapter '+(i+1)+' 열기</button></div></article>'}).join("");
 document.getElementById("stampGrid").innerHTML=quests.map(function(q){var d=state.done.indexOf(q.id)>=0;return '<div class="stamp '+(d?"done":"")+'" onclick="openQuest(\''+q.id+'\')"><div><div class="e">'+q.icon+'</div><b>'+q.stamp+'</b><div class="tiny">'+(d?"획득 완료":"아직 비밀")+'</div></div></div>'}).join("");
 var done=quests.filter(function(q){return state.done.indexOf(q.id)>=0});document.getElementById("memoryList").innerHTML=done.length?done.map(function(q){return '<article class="memory"><div class="kicker">CHAPTER '+q.day+' · '+q.place+'</div><h3>'+q.icon+' '+q.title+'</h3><p>'+q.memory+'</p>'+(state.photos[q.id]?'<img src="'+state.photos[q.id]+'">':'<div class="tiny" style="margin-top:8px">📷 사진 없음</div>')+'</article>'}).join(""):'<div class="hero center"><p>아직 기록된 이야기가 없어.<br>첫 Quest를 완료하면 한 장씩 채워져.</p></div>';
}
function questCard(q){return '<div class="quest" onclick="openQuest(\''+q.id+'\')"><div class="ico">'+q.icon+'</div><div><h3>'+q.title+'</h3><p>'+q.place+' · Chapter '+q.day+'</p></div><div class="go">열기 ›</div></div>'}
function showChapter(day){go("route");var list=quests.filter(function(q){return q.day===day});document.getElementById("chapters").innerHTML='<button class="secondary" onclick="render()">← 3일 코스로 돌아가기</button><div class="section"><h2>Chapter '+day+'</h2><small>'+chapterInfo[day-1].date+'</small></div><article class="chapter"><img src="'+chapterInfo[day-1].img+'"><div class="body"><h3>'+chapterInfo[day-1].title+'</h3><p>'+chapterInfo[day-1].sub+'</p></div></article>'+list.map(questCard).join("")}
function openQuest(id){
 var q=quests.find(function(x){return x.id===id});var d=state.done.indexOf(id)>=0;var ph=state.photos[id];var m=document.getElementById("questModal");
 m.innerHTML='<div style="font-size:54px">'+q.icon+'</div><div class="kicker">CHAPTER '+q.day+' · '+q.place+'</div><h2>'+q.title+'</h2><div class="mission"><b>🔎 오늘의 미션</b><br>'+q.mission+'</div><div class="real"><img src="'+q.photo+'" loading="lazy"><div class="cap"><b>📍 실사 미리보기</b><br>현장에서 이 장소를 먼저 찾고, 아래 촬영 아이디어를 따라 해보자.</div></div><div class="shot"><b>📸 스탬프 사진 아이디어</b><br>'+q.shot+'</div>'+(ph?'<img class="preview" src="'+ph+'"><label class="camera" for="cam-'+id+'">📷 다시 찍기 / 다른 사진</label>':'<label class="camera" for="cam-'+id+'">📷 미션 사진 찍기</label>')+'<input class="cameraInput" id="cam-'+id+'" type="file" accept="image/*" capture="environment" onchange="photo(\''+id+'\',this)"><div class="tiny" style="margin-top:8px">사진은 서버가 아니라 이 기기의 브라우저에만 저장돼.</div>'+(d?'<button class="secondary" onclick="closeQuest()">이미 스탬프 획득 · 닫기</button>':(ph?'<button class="cta" onclick="complete(\''+id+'\')">이 사진으로 스탬프 찍기</button>':'<button class="secondary" onclick="complete(\''+id+'\')">사진 없이 스탬프 찍기</button>'));
 document.getElementById("questOverlay").classList.add("show")
}
function closeQuest(){document.getElementById("questOverlay").classList.remove("show")}
function photo(id,input){var f=input.files&&input.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){var img=new Image();img.onload=function(){var max=720,s=Math.min(1,max/Math.max(img.width,img.height));var c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);state.photos[id]=c.toDataURL("image/jpeg",.65);save();render();openQuest(id)};img.src=e.target.result};r.readAsDataURL(f)}
function complete(id){if(state.done.indexOf(id)<0){state.done.push(id);state.done.sort(function(a,b){return quests.find(function(q){return q.id===a}).order-quests.find(function(q){return q.id===b}).order});save()}closeQuest();var q=quests.find(function(x){return x.id===id});document.getElementById("stampModal").innerHTML='<div class="center"><div class="seal">'+q.icon+'</div><h2>쾅! '+q.stamp+'</h2><p>새로운 인장을 얻었어!</p><button class="cta" onclick="document.getElementById(\'stampOverlay\').classList.remove(\'show\')">다음 이야기 보기</button></div>';document.getElementById("stampOverlay").classList.add("show");render()}
function safe(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
document.getElementById("teamInput").addEventListener("keydown",function(e){if(e.key==="Enter")start()});
if(state.team){document.getElementById("onboarding").hidden=true;document.getElementById("app").hidden=false;render();go("home")}
</script>
</body>
</html>
