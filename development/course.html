<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Adventures · AI 코스 연결</title>
<style>*{box-sizing:border-box}body{max-width:760px;margin:40px auto;padding:0 22px;background:#f8f7f2;color:#253f35;font:16px/1.7 system-ui}h1{letter-spacing:-1px}small{color:#6e7d6c}label{display:block;margin:18px 0 6px}input,select,textarea,button{font:inherit;border:1px solid #ced8c4;border-radius:10px;padding:11px;color:inherit;background:white}input,textarea{width:100%}button{cursor:pointer;margin-top:15px}button.primary{background:#315c46;color:white}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:10px;align-items:center}.row input{flex:1;min-width:0}.card{background:white;border:1px solid #e1e6d9;border-radius:20px;padding:22px;margin:20px 0}.place{border-top:1px solid #e1e6d9;padding:15px 0}.place small{display:block}#status{white-space:pre-wrap}#status:empty{display:none}[hidden]{display:none!important}:focus-visible{outline:3px solid #a88434;outline-offset:3px}</style>
<small>OUR ADVENTURES · T0 개발 실험</small><h1>AI 연결 검증</h1><p>이 화면은 종전 AI 장소 추천 실험입니다. 최신 서비스의 ‘지도 검색 + AI 스탬프 문구’ 구현과 구분하며 운영 여행 데이터로 사용하지 않습니다.</p>
<form id="generate" class="card"><label for="destination">목적지</label><input id="destination" required maxlength="100" placeholder="예: 대한민국 부산 해운대"><label for="days">여행 기간</label><select id="days"><option value="1">1일</option><option value="2">2일</option><option value="3">3일</option><option value="4">4일</option><option value="5">5일</option><option value="6">6일</option><option value="7">7일</option></select><div><button class="primary" id="generate-button">AI로 코스 추천받기</button> <button id="manual" type="button">직접 장소 입력</button></div><small>추천은 방문 후보 초안이에요. 장소 위치와 운영 여부는 방문 전에 확인해주세요.</small></form>
<p id="status" role="status" aria-live="polite"></p>
<section id="editor" class="card" hidden><h2>추천 코스 다듬기</h2><label for="title">여행 이름</label><input id="title" maxlength="100"><div id="places"></div><button id="add">+ 장소 추가</button><hr><button id="confirm" class="primary">이 코스로 새 여행 데이터 만들기</button><p><small>이 화면은 AI 연결 검증용입니다. 실제 그룹 서비스와는 아직 연결하지 않았어요. 새 여행에는 사진·완료 기록이 들어가지 않습니다.</small></p><pre id="saved" style="white-space:pre-wrap"></pre></section>
<script>
const $=s=>document.querySelector(s);let draft=[],generation=0;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for(const field of ['#destination','#days'])$(field).addEventListener('change',()=>{generation++;draft=[];$('#editor').hidden=true;$('#title').value='';$('#saved').textContent='';$('#status').textContent='목적지·기간이 변경됐어요. 새 조건으로 코스를 추천받아주세요.';});
function render(){ $('#editor').hidden=false;$('#places').innerHTML=draft.map((p,i)=>`<div class="place"><div class="row"><span>${esc(p.icon)}</span><input aria-label="장소 ${i+1}" data-name="${i}" value="${esc(p.name)}" maxlength="100"><span>${p.day}일차</span></div><small>${esc(p.reason)}</small><button data-up="${i}" ${i===0?'disabled':''}>↑</button> <button data-down="${i}" ${i===draft.length-1?'disabled':''}>↓</button> <button data-remove="${i}">삭제</button></div>`).join(''); }
function remember(){document.querySelectorAll('[data-name]').forEach(el=>draft[Number(el.dataset.name)].name=el.value);}
$('#generate').onsubmit=async e=>{e.preventDefault();if(draft.length&&!confirm('현재 편집 중인 코스를 새 추천으로 바꿀까요?'))return;const run=++generation;$('#generate-button').disabled=true;$('#manual').disabled=true;$('#confirm').disabled=true;$('#add').disabled=true;$('#status').textContent='목적지에 맞는 장소를 찾고 있어요…';$('#editor').inert=true;try{const res=await fetch('/api/courses/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({destination:$('#destination').value,days:Number($('#days').value)})});const result=await res.json();if(!res.ok)throw Error(result.error||'추천을 받지 못했어요.');if(run!==generation)return;draft=result.places;$('#title').value=result.title;$('#saved').textContent='';render();$('#status').textContent='AI 추천을 받았어요. 장소와 순서를 확인한 뒤 확정해주세요.';}catch(err){$('#status').textContent=err.message;}finally{$('#generate-button').disabled=false;$('#manual').disabled=false;$('#confirm').disabled=false;$('#add').disabled=false;$('#editor').inert=false;}};
$('#manual').onclick=()=>{if(draft.length&&!confirm('편집 중인 코스를 비우고 직접 입력할까요?'))return;generation++;draft=[];$('#title').value=$('#destination').value.trim()?$('#destination').value.trim()+' 여행':'';$('#saved').textContent='';$('#status').textContent='장소를 직접 추가해주세요.';render();};
$('#add').onclick=()=>{remember();if(draft.length>=20)return $('#status').textContent='장소는 최대 20개까지 구성할 수 있어요.';draft.push({name:'',day:1,reason:'직접 추가한 장소',icon:'📍'});render();};
$('#places').onclick=e=>{const b=e.target.closest('button');if(!b)return;remember();if(b.dataset.remove!==undefined)draft.splice(Number(b.dataset.remove),1);else{const i=Number(b.dataset.up??b.dataset.down),j=i+(b.dataset.up!==undefined?-1:1);if(j>=0&&j<draft.length)[draft[i],draft[j]]=[draft[j],draft[i]];}render();};
$('#confirm').onclick=()=>{remember();const destination=$('#destination').value.trim(),title=$('#title').value.trim();if(!destination||!title||draft.some(p=>!p.name.trim()))return $('#status').textContent='목적지·여행명·장소 이름을 확인해주세요.';const names=draft.map(p=>p.name.trim().normalize('NFKC').toLowerCase());if(new Set(names).size!==names.length)return $('#status').textContent='같은 이름의 장소가 있어요. 중복을 정리해주세요.';const trip={id:crypto.randomUUID(),destination,name:title,days:Number($('#days').value),places:draft.map(p=>({id:crypto.randomUUID(),...p,name:p.name.trim()})),records:[],completions:[]};const blob=new Blob([JSON.stringify(trip,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='new-trip-course.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);$('#saved').textContent=`새 여행 데이터 생성 완료\n${trip.places.length}개 장소 · 사진 0개 · 완료 스탬프 0개`;};
</script></html>
