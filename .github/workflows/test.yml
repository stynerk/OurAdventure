name: Test Shared Adventure
on:
  pull_request:
  push:
    branches: [main, 'engineering/**']
permissions:
  contents: read
jobs:
  firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix functions
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:callable-client
