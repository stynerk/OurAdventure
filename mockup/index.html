<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Adventures — 함께 떠나 각자의 추억으로</title>
<style>
:root{--ink:#253f35;--green:#315c46;--lime:#d9edaa;--paper:#f8f7f2;--line:#e2e6dc;--muted:#748074}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 system-ui,-apple-system,'Segoe UI',sans-serif}button,input,textarea,select{font:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:13px;padding:11px 17px;min-height:46px;font-weight:650}button:hover{border-color:#8aa47c}button:disabled{opacity:.45;cursor:wait}button.primary{background:var(--green);border-color:var(--green);color:white}button.soft{background:var(--lime);border-color:var(--lime)}button.small{padding:5px 12px;min-height:38px;font-size:13px}button.link{background:none;border:0;padding:0;color:var(--green)}:focus-visible{outline:3px solid #ae8639;outline-offset:3px}input,select,textarea{width:100%;padding:12px;border:1px solid #cad3c4;background:white;border-radius:11px;color:var(--ink)}textarea{resize:vertical}label{display:block;font-weight:650;margin:17px 0 6px}h1,h2,h3,p{margin:0 0 12px}h1{font-size:clamp(30px,4vw,48px);letter-spacing:-1.8px;line-height:1.2}h2{font-size:24px;letter-spacing:-.7px}h3{font-size:18px}small,.muted{color:var(--muted)}small{font-size:12px}.shell{max-width:1140px;margin:auto;padding:0 30px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:24px 0;border-bottom:1px solid var(--line)}.brand{font-size:20px;font-weight:850;letter-spacing:-.7px}.brand span{color:#7e9c56}.badge{display:inline-block;border:1px solid #d5ddcb;background:#eef3e6;border-radius:30px;padding:3px 10px;font-size:11px;font-weight:700;vertical-align:middle}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1}.intro{padding:44px 0 26px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:750;color:#788859;margin-bottom:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.two{display:grid;grid-template-columns:1.3fr 1fr;gap:26px;align-items:start}.card{border:1px solid var(--line);border-radius:22px;background:white;padding:24px}.card + .card{margin-top:16px}.grid>.card{margin:0}.hero{background:#e9efdd;border:1px solid #dce5cf;border-radius:26px;padding:34px;margin:25px 0}.hero p{max-width:540px}.cover{height:140px;border-radius:16px;margin-bottom:20px;background:#e9efdf;position:relative;overflow:hidden}.cover:before{content:'';position:absolute;width:230px;height:120px;border-radius:100% 100% 0 0;background:#a4ba8c;bottom:-20px;left:-30px;transform:rotate(-8deg)}.cover:after{content:'✳';position:absolute;right:28px;top:10px;font-size:70px;color:#d0aa64}.cover.blue{background:#e1ecee}.cover.blue:before{background:#9bb8ae}.cover.peach{background:#f2e9dc}.cover.peach:before{background:#c8b396}.meta{font-size:12px;color:var(--muted);margin-bottom:10px}.progress{height:7px;border-radius:8px;background:#edf0e8;overflow:hidden;margin:14px 0}.progress i{height:100%;display:block;background:#8cac65}.tabs{display:flex;gap:7px;margin:24px 0;border-bottom:1px solid var(--line);padding-bottom:12px}.tabs button{background:transparent;border-color:transparent}.tabs button.active{background:var(--green);color:white}.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stamp{aspect-ratio:1;border:2px dashed #cdd7c3;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;background:#fafbf7}.stamp.done{border:3px double #65834f;background:#edf4e2}.stamp b{font-size:30px;line-height:1.3}.stamp span{font-size:12px}.place{display:flex;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding:17px 0}.place:last-child{border:0}.number{display:grid;place-items:center;width:38px;height:38px;background:#edf2e5;border-radius:50%;flex-shrink:0}.notice{border-radius:13px;background:#eef2e7;padding:13px 17px;font-size:13px;margin:15px 0}.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.post{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:white}.post img{width:100%;height:210px;object-fit:cover;display:block}.post .body{padding:17px}.empty{padding:40px 20px;text-align:center;border:1px dashed #cbd6bf;border-radius:20px;background:#fff}.preview{width:100%;max-height:310px;object-fit:contain;border-radius:14px;margin:15px 0;background:#eff1e9}.steps{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:22px 0}.steps span{padding:5px 10px;background:#edf0e7;border-radius:30px}.form{max-width:650px;margin:28px auto}.footer{font-size:12px;color:var(--muted);padding:38px 0 25px;margin-top:30px;border-top:1px solid var(--line)}.member{padding:14px 0;border-bottom:1px solid var(--line)}.summary{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:12px;margin:24px 0}.summary b{display:block;font-size:28px}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#253f35;color:white;border-radius:14px;padding:13px 22px;box-shadow:0 5px 25px #0002;z-index:10;max-width:90vw}#toast:empty{display:none}canvas{max-width:100%;height:auto;border-radius:16px;box-shadow:0 8px 35px #243c3512}.export{position:sticky;top:20px}[hidden]{display:none!important}.danger{color:#964e37}.login{max-width:820px;margin:65px auto}.login .hero{padding:50px}.login h1{max-width:600px}.account{max-width:170px} @media(max-width:700px){.shell{padding:0 18px}.top{padding:18px 0}.brand{font-size:17px}.grid,.two{grid-template-columns:1fr}.intro{padding-top:30px}.hero{padding:24px}.card{padding:20px}.photos{gap:12px}.post img{height:155px}.stamps{gap:10px}.stamp{padding:8px}.account{max-width:125px}.login{margin:25px auto}.login .hero{padding:30px 24px}.export{position:static}.top>.row{gap:6px}.summary b{font-size:24px}}@media print{.top,.tabs,.footer,button,.no-print{display:none!important}.two{display:block}.card{break-inside:avoid}.export{position:static}}
</style>
</head>
<body><div class="shell"><header class="top"><div class="brand">✳ Our <span>Adventures</span> <span class="badge">체험판</span></div><div id="account"></div></header><main id="app"></main><footer class="footer">로그인·초대는 모의 동작입니다. 사진과 기록은 이 브라우저에만 저장되며 서버에 전송되지 않습니다. <button class="link" data-action="reset">체험 데이터 초기화</button></footer></div><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const KEY='our-adventures-mockup-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
function seed(){return {logged:false,user:'me',groups:[{id:'family',name:'우리 가족 탐험대',members:[{id:'me',name:'나',owner:true},{id:'child',name:'꼬마 탐험가'},{id:'partner',name:'여행 친구'}]}],trips:[{id:'gyeongju',group:'family',name:'가을 경주, 함께 걷는 날',date:'2026-10-26',places:[{id:'p1',name:'대릉원',icon:'🌳'},{id:'p2',name:'첨성대',icon:'✨'},{id:'p3',name:'월정교',icon:'🌉'}],records:[]}]};}
let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed();if(!Array.isArray(db.groups)||!Array.isArray(db.trips))db=seed();}catch{db=seed();}
let view=db.logged?'groups':'login',groupId=db.groups[0]?.id,tripId=null,tab='stamps',photo=null,busy=false,saveBusy=false;
const group=()=>db.groups.find(g=>g.id===groupId);
const trip=()=>db.trips.find(t=>t.id===tripId);
const member=()=>group()?.members.find(m=>m.id===db.user);
const owner=()=>!!member()?.owner;
const records=(t=trip(),user=db.user)=>t.records.filter(r=>r.user===user);
const completed=(t=trip(),user=db.user)=>new Set(records(t,user).map(r=>r.place)).size;
function toast(s){$('#toast').textContent=s;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').textContent='',4200);}
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));db=next;return true;}catch{toast('브라우저 저장 공간이 부족해요. 기존 기록은 유지했어요.');return false;}}
function change(fn){const next=JSON.parse(JSON.stringify(db));fn(next);return persist(next);}
function go(v){if(busy||saveBusy)return;view=v;photo=null;render();window.scrollTo(0,0);}
function intro(eyebrow,title,desc=''){return `<section class="intro"><div class="eyebrow">${eyebrow}</div><h1>${esc(title)}</h1><p class="muted">${esc(desc)}</p></section>`;}
function render(){
$('#account').innerHTML=db.logged?`<div class="row"><button class="small" data-action="groups">내 그룹</button>${group()&&view!=='groups'?`<select class="account" id="user" aria-label="체험 멤버 전환" ${busy||saveBusy?'disabled':''}>${group().members.map(m=>`<option value="${esc(m.id)}" ${db.user===m.id?'selected':''}>${esc(m.name)}${m.owner?' · 리더':''}</option>`).join('')}</select>`:''}</div>`:'<span class="muted">함께 떠나 각자의 추억으로</span>';
const root=$('#app');
if(view==='login'){root.innerHTML=`<section class="login"><div class="eyebrow">LITTLE MOMENTS, OUR ADVENTURES</div><h1>같이 떠난 여행,<br>각자의 추억으로.</h1><div class="hero"><div class="cover"></div><p>우리만의 코스를 만들고, 사진 한 장으로 나만의 스탬프를 모아보세요. 여행이 끝나면 함께 만든 앨범이 남아요.</p><button class="primary" data-action="login">체험 로그인으로 시작하기 →</button><p><small>실제 계정 없이 모든 흐름을 둘러볼 수 있어요.</small></p></div></section>`;return;}
if(view==='groups'){root.innerHTML=intro('YOUR PEOPLE, YOUR STORIES','누구와 떠나볼까요?','그룹은 그대로, 새로운 여행은 계속 쌓여요.')+`<div class="grid">${db.groups.map((g,i)=>`<article class="card"><div class="cover ${i%2?'blue':''}"></div><div class="meta">멤버 ${g.members.length}명 · 여행 ${db.trips.filter(t=>t.group===g.id).length}개</div><h2>${esc(g.name)}</h2><p class="muted">우리의 다음 이야기를 이어가요.</p><button class="primary" data-group="${g.id}">그룹 열기 →</button></article>`).join('')}<article class="card"><div class="cover peach"></div><h2>새로운 여행 메이트</h2><p class="muted">가족, 친구, 동료와 그룹을 만들어요.</p><button data-action="new-group">+ 그룹 만들기</button></article></div>`;return;}
if(view==='new-group'){root.innerHTML=`<div class="form">${intro('STEP 01 · GROUP','함께할 사람들의 이름','한 번 만든 그룹에서 여러 여행을 이어갈 수 있어요.')}<form id="group-form" class="card"><label for="group-name">그룹 이름</label><input id="group-name" name="name" required maxlength="50" placeholder="예: 주말마다 떠나는 우리"><button class="primary" style="margin-top:24px">그룹 만들기 →</button></form></div>`;return;}
if(view==='group'){root.innerHTML=intro('OUR TRAVEL CLUB',group().name,`멤버 ${group().members.length}명 · 함께 만든 여행을 모아봤어요.`)+`<div class="row between"><h2>우리의 여행</h2>${owner()?'<button class="primary" data-action="new-trip">+ 새 여행 만들기</button>':''}</div><div class="grid" style="margin-top:20px">${db.trips.filter(t=>t.group===groupId).map((t,i)=>`<article class="card"><div class="cover ${i%2?'blue':''}"></div><div class="meta">${esc(t.date)} · ${t.places.length}개 장소</div><h2>${esc(t.name)}</h2><p class="muted">내 스탬프 ${completed(t)} / ${t.places.length}</p><div class="progress"><i style="width:${completed(t)/t.places.length*100}%"></i></div><button data-trip="${t.id}">여행 이어가기 →</button></article>`).join('')||'<div class="empty">아직 여행이 없어요. 첫 여행을 만들어보세요.</div>'}</div>`;return;}
if(view==='new-trip'){root.innerHTML=`<div class="form">${intro('STEP 02 · PLAN','어디로 떠날까요?','장소를 적으면 나만의 스탬프 코스가 준비돼요.')}<form id="trip-form" class="card"><label for="trip-name">여행 이름</label><input id="trip-name" name="name" required maxlength="80" placeholder="예: 부산 바다 산책"><label for="date">여행 날짜</label><input id="date" name="date" type="date" required value="${new Date().toLocaleDateString('sv-SE')}"><label for="places">방문할 장소 · 한 줄에 하나씩</label><textarea id="places" name="places" rows="5" required placeholder="해운대\n흰여울문화마을\n광안리"></textarea><small>입력한 순서대로 코스와 기본 스탬프가 생겨요.</small><div style="margin-top:24px"><button class="primary">코스·스탬프 만들기 →</button></div></form></div>`;return;}
if(view==='invite'){const url=new URL(location.href);url.search='';url.hash='join='+tripId;root.innerHTML=`<div class="form">${intro('STEP 03 · INVITE','같이 떠날 친구를 초대해요',trip().name)}<div class="card"><label for="invite-url">체험 초대 링크</label><input id="invite-url" value="${esc(url.href)}" readonly><button style="margin-top:12px" data-action="copy">링크 복사</button><div class="notice">같은 브라우저의 목업 데이터에서만 참여할 수 있어요. 다른 기기로 초대하는 기능은 실제 서비스에서 연결됩니다.</div><form id="join-form"><label for="alias">참여할 멤버의 별칭</label><input id="alias" name="alias" required maxlength="30" placeholder="예: 바다 좋아"><button class="primary" style="margin-top:15px">초대받은 멤버로 참여하기 →</button></form></div><button style="margin-top:18px" data-action="travel">여행 화면으로 돌아가기</button></div>`;return;}
if(view==='capture'){const p=trip().places.find(p=>p.id===capturePlace);root.innerHTML=`<div class="form">${intro('STEP 04 · CAPTURE',p.name,`${member().name}님의 스탬프를 남겨요.`)}<form id="capture-form" class="card"><div class="notice">사진 저장에 성공하면 내 스탬프가 완료돼요. 다른 멤버의 스탬프는 바뀌지 않아요.</div><label for="photo">사진 촬영 또는 선택</label><input id="photo" type="file" accept="image/*" capture="environment" required><img id="photo-preview" class="preview" alt="저장할 사진 미리보기" hidden><label for="feeling">한 줄 느낌 <small>선택</small></label><input id="feeling" name="feeling" maxlength="120" placeholder="예: 바람까지 기억하고 싶은 순간"><p><small>사진과 느낌은 이 여행 구성원 모두가 함께 봐요.</small></p><button class="primary" id="save-photo">사진 저장하고 내 스탬프 완료</button><button type="button" data-action="travel">돌아가기</button></form></div>`;return;}
renderTravel();
}
let capturePlace=null;
function renderTravel(){const t=trip(),g=group(),count=completed();$('#app').innerHTML=intro('OUR NEXT CHAPTER',t.name,`${g.name} · ${t.date}`)+`<div class="row between"><div class="row"><span class="badge">${esc(member().name)}의 여행</span><span class="muted">내 스탬프 ${count} / ${t.places.length}</span></div>${owner()?'<button data-action="invite">멤버 초대 ↗</button>':''}</div><nav class="tabs" aria-label="여행 메뉴">${[['stamps','✳ 코스·스탬프'],['memories','▧ 함께 남긴 기록'],['results','↗ 여행 결과']].map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'active':''}" ${tab===k?'aria-current="page"':''}>${v}</button>`).join('')}</nav>${tab==='stamps'?stampScreen(t,g):tab==='memories'?memoryScreen(t,g):resultScreen(t,g)}`;if(tab==='results')drawPreview();}
function stampScreen(t,g){return `<div class="two"><section class="card"><div class="row between"><h2>나의 스탬프 여권</h2><span class="badge">PERSONAL PASSPORT</span></div><p class="muted">사진 한 장으로 오늘을 기억해요.</p><div class="stamps">${t.places.map(p=>{const done=t.records.some(r=>r.user===db.user&&r.place===p.id);return `<button class="stamp ${done?'done':''}" data-capture="${p.id}" aria-label="${esc(p.name)} ${done?'완료, 사진 보기':'사진으로 완료하기'}"><b>${p.icon}</b><strong>${esc(p.name)}</strong><span>${done?'✓ 내 스탬프 완료':'사진 찍고 완료'}</span></button>`;}).join('')}</div><div class="notice">우측 상단 멤버를 바꿔보세요. 같은 여행에서도 각자의 스탬프를 모아요.</div></section><section class="card"><h2>오늘의 코스</h2>${t.places.map((p,i)=>`<div class="place"><span class="number">${i+1}</span><div class="grow"><strong>${esc(p.name)}</strong><div class="meta">${t.records.filter(r=>r.place===p.id).length}명이 추억을 남겼어요</div></div><button class="small" data-capture="${p.id}">사진 남기기</button></div>`).join('')}<div style="margin-top:25px"><h3>함께하는 사람들</h3>${g.members.map(m=>`<div class="row between member"><span>${esc(m.name)}${m.owner?' · 리더':''}</span><small>${completed(t,m.id)} / ${t.places.length} 완료</small></div>`).join('')}</div></section></div>`;}
function memoryScreen(t,g){return t.records.length?`<div class="photos">${t.records.slice().reverse().map(r=>`<article class="post"><img src="${r.photo}" alt="${esc(t.places.find(p=>p.id===r.place)?.name)}에서 남긴 여행 사진"><div class="body"><div class="meta">${esc(g.members.find(m=>m.id===r.user)?.name)} · ${esc(t.places.find(p=>p.id===r.place)?.name)}</div><h3>${esc(r.feeling||'사진으로 남긴 오늘의 순간')}</h3><small>✳ 개인 스탬프 완료</small></div></article>`).join('')}</div>`:'<div class="empty"><h2>우리의 첫 사진을 기다려요.</h2><p class="muted">코스에서 사진을 남기면 이곳에 함께 모여요.</p><button data-tab="stamps">첫 스탬프 남기기 →</button></div>';}
function resultScreen(t,g){return `<div class="two"><section><div class="card"><div class="eyebrow">THE MOMENTS WE COLLECTED</div><h2>우리의 여행 한눈에</h2><div class="summary"><div><b>${g.members.length}</b><small>함께한 사람</small></div><div><b>${t.places.length}</b><small>코스의 장소</small></div><div><b>${t.records.length}</b><small>완료한 개인 스탬프</small></div></div>${g.members.map(m=>`<div class="member"><div class="row between"><strong>${esc(m.name)}</strong><small>${completed(t,m.id)} / ${t.places.length} 완료</small></div><div class="progress"><i style="width:${completed(t,m.id)/t.places.length*100}%"></i></div></div>`).join('')}<button style="margin-top:20px" data-action="print">리포트 인쇄 / PDF 저장</button></div><div class="card no-print"><h3>마음에 드는 순간을 골라요</h3><p class="muted">최대 4장을 선택해 인스타용 카드로 저장해요.</p>${t.records.length?t.records.map(r=>`<label class="row"><input type="checkbox" class="export-pick" value="${r.id}" style="width:20px" ${selected.includes(r.id)?'checked':''}><span>${esc(g.members.find(m=>m.id===r.user)?.name)} · ${esc(t.places.find(p=>p.id===r.place)?.name)}</span></label>`).join(''):'<p>먼저 사진을 남겨보세요. 기록이 없는 요약 카드도 저장할 수 있어요.</p>'}</div></section><aside class="export"><canvas id="result-canvas" width="1080" height="1350" aria-label="인스타그램용 여행 결과 이미지 미리보기"></canvas><button class="primary no-print" style="width:100%;margin-top:18px" id="download" data-action="download" disabled>인스타용 이미지 저장 · PNG</button></aside></div>`;}
let selected=[],previewVersion=0;
async function drawPreview(){const version=++previewVersion,c=$('#result-canvas');if(!c)return;const ctx=c.getContext('2d'),t=trip(),g=group();const picks=selected.map(id=>t.records.find(r=>r.id===id)).filter(Boolean).slice(0,4);ctx.fillStyle='#f4f3e9';ctx.fillRect(0,0,1080,1350);ctx.fillStyle='#315c46';ctx.fillRect(0,0,1080,18);ctx.font='bold 23px sans-serif';ctx.fillText('OUR ADVENTURES  /  TRAVEL NOTES',65,90);ctx.font='bold 51px sans-serif';ctx.fillText(t.name,65,175,950);ctx.fillStyle='#75816d';ctx.font='25px sans-serif';ctx.fillText(`${g.name}  ·  ${t.date}`,65,225,950);
const images=await Promise.all(picks.map(r=>new Promise(resolve=>{const img=new Image();img.onload=()=>resolve({r,img});img.onerror=()=>resolve({r,img:null});img.src=r.photo;})));if(version!==previewVersion||!c.isConnected)return;
if(!images.length){ctx.fillStyle='#e1e9d5';ctx.fillRect(65,285,950,760);ctx.fillStyle='#6e8b51';ctx.font='90px sans-serif';ctx.fillText('✳',475,600);ctx.font='bold 36px sans-serif';ctx.fillText('함께 떠나, 각자의 추억으로',170,745,760);}else images.forEach(({r,img},i)=>{const x=65+(i%2)*485,y=285+Math.floor(i/2)*420,w=465,h=325;if(img){const scale=Math.max(w/img.width,h/img.height),sw=w/scale,sh=h/scale;ctx.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,x,y,w,h);}else{ctx.fillStyle='#e1e9d5';ctx.fillRect(x,y,w,h);}ctx.fillStyle='#315c46';ctx.font='bold 22px sans-serif';ctx.fillText(`${g.members.find(m=>m.id===r.user)?.name} · ${t.places.find(p=>p.id===r.place)?.name}`,x,y+359,w);ctx.fillStyle='#75816d';ctx.font='21px sans-serif';ctx.fillText(r.feeling||'사진으로 기억하는 순간',x,y+391,w);});ctx.fillStyle='#315c46';ctx.font='bold 29px sans-serif';ctx.fillText(`${g.members.length}명의 여행 메이트 · ${t.records.length}개의 개인 스탬프`,65,1210,950);ctx.fillStyle='#75816d';ctx.font='22px sans-serif';ctx.fillText('조금씩 다른 시선으로, 함께 만든 여행.',65,1260);$('#download').disabled=false;}
async function preparePhoto(file){if(!file)return;busy=true;$('#save-photo').disabled=true;const ownTrip=tripId,ownUser=db.user;try{const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=data;});const c=document.createElement('canvas'),scale=Math.min(1,1200/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);if(view==='capture'&&tripId===ownTrip&&db.user===ownUser){photo=c.toDataURL('image/jpeg',.8);$('#photo-preview').src=photo;$('#photo-preview').hidden=false;}}catch{photo=null;$('#photo-preview').hidden=true;toast('사진을 읽지 못했어요. JPEG·PNG 등 다른 사진을 선택해주세요.');}finally{busy=false;if($('#save-photo'))$('#save-photo').disabled=false;}}
document.addEventListener('change',e=>{if(e.target.id==='user'){if(busy||saveBusy)return;db.user=e.target.value;photo=null;if(view==='capture'||view==='new-trip'||view==='invite')view='travel';render();toast('멤버를 전환했어요. 개인별 완료 상태를 확인하세요.');}if(e.target.id==='photo')preparePhoto(e.target.files[0]);if(e.target.classList.contains('export-pick')){const values=[...document.querySelectorAll('.export-pick:checked')].map(x=>x.value);if(values.length>4){e.target.checked=false;toast('카드에는 사진을 최대 4장 담을 수 있어요.');return;}selected=values;$('#download').disabled=true;drawPreview();}});
document.addEventListener('submit',async e=>{e.preventDefault();if(busy||saveBusy)return;const form=e.target,data=new FormData(form);if(form.id==='group-form'){const name=data.get('name').trim();if(!name)return;const id=uid();if(change(d=>d.groups.push({id,name,members:[{id:d.user,name:'나',owner:true}]}))){groupId=id;go('group');}}if(form.id==='trip-form'){if(!owner())return;const name=data.get('name').trim(),places=data.get('places').split('\n').map(x=>x.trim()).filter(Boolean);if(!name||!places.length)return toast('여행 이름과 방문 장소를 입력해주세요.');if(places.length>20)return toast('체험판에서는 장소를 최대 20개까지 넣어주세요.');const id=uid(),icons=['🌳','✨','🌉','🌊','🏡','☀️'];if(change(d=>d.trips.push({id,group:groupId,name,date:data.get('date'),places:places.map((name,i)=>({id:uid(),name,icon:icons[i%icons.length]})),records:[]}))){tripId=id;go('invite');}}if(form.id==='join-form'){const name=data.get('alias').trim();if(!name)return;const id=uid();if(change(d=>{d.groups.find(g=>g.id===groupId).members.push({id,name,owner:false});d.user=id;d.logged=true;})){history.replaceState(null,'',location.pathname+location.search);tab='stamps';go('travel');toast('그룹에 참여했어요. 내 스탬프는 지금부터 시작이에요.');}}if(form.id==='capture-form'){if(!photo)return toast('먼저 사진을 선택해주세요.');saveBusy=true;$('#save-photo').disabled=true;const r={id:uid(),user:db.user,place:capturePlace,photo,feeling:data.get('feeling').trim(),created:new Date().toISOString()};const ok=change(d=>{const t=d.trips.find(t=>t.id===tripId),i=t.records.findIndex(x=>x.user===r.user&&x.place===r.place);if(i>=0)t.records[i]=r;else t.records.push(r);});saveBusy=false;if(ok){tab='stamps';go('travel');toast('사진을 저장했어요. 내 스탬프 완료!');}else $('#save-photo').disabled=false;}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||b.disabled||busy||saveBusy)return;if(b.dataset.group){groupId=b.dataset.group;if(!member())db.user=group().members[0].id;go('group');return;}if(b.dataset.trip){tripId=b.dataset.trip;selected=trip().records.slice(0,4).map(r=>r.id);tab='stamps';go('travel');return;}if(b.dataset.tab){tab=b.dataset.tab;render();return;}if(b.dataset.capture){capturePlace=b.dataset.capture;go('capture');return;}const a=b.dataset.action;if(a==='login'){if(change(d=>d.logged=true))go('groups');}if(a==='groups')go('groups');if(a==='new-group')go('new-group');if(a==='new-trip'&&owner())go('new-trip');if(a==='invite'&&owner())go('invite');if(a==='travel')go('travel');if(a==='copy'){try{await navigator.clipboard.writeText($('#invite-url').value);toast('체험 초대 링크를 복사했어요.');}catch{$('#invite-url').select();toast('링크를 선택했어요. 복사해서 사용해주세요.');}}if(a==='download'){const c=$('#result-canvas');c.toBlob(blob=>{if(!blob)return toast('이미지를 만들지 못했어요. 다시 시도해주세요.');const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='our-adventures-travel-card.png';link.click();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('여행 카드 PNG를 저장했어요.');},'image/png');}if(a==='print')window.print();if(a==='reset'&&confirm('이 체험판에서 만든 그룹·여행·사진을 모두 초기화할까요? 기존 가족 앱 기록은 유지됩니다.')){if(persist(seed())){groupId='family';tripId=null;go('login');}}});
const joinId=location.hash.startsWith('#join=')?location.hash.slice(6):null;
if(joinId){const t=db.trips.find(t=>t.id===joinId);if(t){groupId=t.group;tripId=t.id;view='invite';}else setTimeout(()=>toast('이 브라우저에는 초대된 여행 데이터가 없어요. 같은 브라우저에서 만든 링크로 체험해주세요.'),100);}
render();
</script></body></html>
