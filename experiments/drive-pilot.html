<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OurAdventure · 가족 Drive 연결 테스트</title>
<style>body{font:16px system-ui;margin:24px auto;padding:0 18px;max-width:560px;background:#fffaf0;color:#263b30}label{display:block;margin:14px 0}input,button{font:inherit;box-sizing:border-box;padding:12px;width:100%;border:1px solid #b9cbbf;border-radius:10px}button{margin:6px 0;background:#315d46;color:white;min-height:48px}button:disabled{opacity:.45}img{max-width:100%;border-radius:12px}output{display:block;white-space:pre-wrap;margin:18px 0}small{display:block;line-height:1.6}article{padding:12px;border:1px solid #ccc;margin:12px 0;border-radius:12px}</style>
<h1>가족 사진 연결 테스트</h1><p>부모 두 계정으로 같은 폴더의 사진을 공유할 수 있는지 확인하는 실험입니다. 여행 앱의 로그인·스탬프 동기화는 아직 연결하지 않았습니다.</p>
<details open><summary>개발 설정</summary><label>웹 OAuth Client ID<input id="clientId" placeholder="…apps.googleusercontent.com"></label><label>Picker API key<input id="apiKey"></label><label>Google Cloud 프로젝트 번호<input id="projectNumber" inputmode="numeric"></label><small>Client Secret은 입력하지 않습니다. 설정값과 접근 토큰은 브라우저 메모리에만 유지합니다.</small></details>
<button id="connect">1. Google 계정으로 Drive 연결</button><button id="choose" disabled>2. 가족 폴더 선택</button><p id="folderLabel">폴더 미선택</p>
<label>대표 사진 1장 선택<input id="photo" type="file" accept="image/*" disabled></label><img id="preview" alt="업로드할 압축 사진" hidden><p id="size"></p>
<button id="upload" disabled>3. 이 폴더에 사진 저장</button><button id="list" disabled>4. 앱이 볼 수 있는 사진 확인</button><button id="pickPhotos" disabled>다른 가족 사진을 직접 선택해 보기</button><button id="disconnect" disabled>계정 연결 종료</button>
<output id="status" aria-live="polite">설정값을 입력한 뒤 연결하세요.</output><div id="gallery"></div>
<script src="https://accounts.google.com/gsi/client" async></script><script src="https://apis.google.com/js/api.js" async></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
let token='',expires=0,folder=null,pending=null,busy=false,urls=[];
function status(s){$('status').textContent=s;}
function refresh(){const auth=Boolean(token)&&Date.now()<expires;['choose','disconnect'].forEach(id=>$(id).disabled=!auth||busy);['photo','list','pickPhotos'].forEach(id=>$(id).disabled=!auth||!folder||busy);$('upload').disabled=!auth||!folder||!pending||busy;}
function requireAuth(){if(!token||Date.now()>=expires){token='';refresh();throw Error('Drive 연결이 만료됐습니다. 다시 연결하세요. 선택한 사진은 이 페이지에 남아 있습니다.');}}
async function api(url,options={}){requireAuth();const response=await fetch(url,{...options,headers:{...options.headers,Authorization:'Bearer '+token}});if(!response.ok){if(response.status===401){token='';refresh();}throw Error(response.status===401?'연결이 만료됐습니다. 다시 연결하세요.':response.status===403?'이 파일에 대한 앱 권한 또는 폴더 편집 권한이 없습니다. Picker에서 선택하고 다시 시도하세요.':'Drive 요청 실패 ('+response.status+'). 사진은 저장 완료로 표시하지 않았습니다.');}return response;}
async function run(fn){if(busy)return;busy=true;refresh();try{await fn();}catch(e){status(e.message||'처리에 실패했습니다.');}finally{busy=false;refresh();}}
function clearImages(){urls.forEach(URL.revokeObjectURL);urls=[];$('gallery').replaceChildren();}
function validate(){if(!$('clientId').value.trim().endsWith('.apps.googleusercontent.com'))throw Error('웹 OAuth Client ID를 입력하세요.');if(!$('apiKey').value.trim()||!/^\d+$/.test($('projectNumber').value.trim()))throw Error('Picker API key와 프로젝트 번호를 입력하세요.');}
$('connect').onclick=()=>{try{validate();if(!window.google?.accounts?.oauth2)throw Error('Google 연결 모듈이 아직 준비되지 않았습니다. 잠시 뒤 다시 누르세요.');google.accounts.oauth2.initTokenClient({client_id:$('clientId').value.trim(),scope:'https://www.googleapis.com/auth/drive.file',include_granted_scopes:false,callback:r=>{if(r.error){status('연결이 취소되거나 거절됐습니다.');return;}token=r.access_token;expires=Date.now()+Math.max(0,Number(r.expires_in)-60)*1000;folder=null;$('folderLabel').textContent='폴더 미선택';clearImages();status('Drive 연결 완료. 각 가족이 동일한 폴더를 Picker에서 선택하세요.');refresh();},error_callback:()=>status('팝업이 닫혔거나 차단됐습니다. 다시 연결하세요.')}).requestAccessToken({prompt:'select_account'});}catch(e){status(e.message);}};
function picker(view,callback){requireAuth();validate();if(!window.gapi)throw Error('Picker 모듈이 아직 준비되지 않았습니다.');gapi.load('picker',{callback:()=>{try{const p=new google.picker.PickerBuilder().addView(view()).setOAuthToken(token).setDeveloperKey($('apiKey').value.trim()).setAppId($('projectNumber').value.trim()).setOrigin(location.origin).setCallback(callback).build();p.setVisible(true);}catch(e){status(e.message);}},onerror:()=>status('Picker를 불러오지 못했습니다.')});}
$('choose').onclick=()=>{try{picker(()=>new google.picker.DocsView(google.picker.ViewId.FOLDERS).setIncludeFolders(true).setSelectFolderEnabled(true),data=>{if(data.action!==google.picker.Action.PICKED)return;run(async()=>{const selected=data.docs[0];const f=await(await api('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(selected.id)+'?fields=id,name,mimeType,capabilities(canAddChildren)')).json();if(f.mimeType!=='application/vnd.google-apps.folder'||!f.capabilities?.canAddChildren)throw Error('사진을 추가할 수 있는 폴더를 선택하세요.');folder=f;$('folderLabel').textContent='저장 폴더: '+f.name;status('폴더 확인 완료. 사진을 선택하세요.');});});}catch(e){status(e.message);}};
async function compress(file){if(!file.type.startsWith('image/'))throw Error('사진 파일을 선택하세요.');if(file.size>40*1024*1024)throw Error('40MB 이하 사진으로 테스트하세요.');const u=URL.createObjectURL(file);try{const im=new Image();im.src=u;await im.decode();const ratio=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*ratio);c.height=Math.round(im.naturalHeight*ratio);const ctx=c.getContext('2d');if(!ctx)throw Error('이미지 변환을 지원하지 않습니다.');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);let blob;for(const quality of [.82,.72,.62,.52]){blob=await new Promise(resolve=>c.toBlob(resolve,'image/jpeg',quality));if(!blob)throw Error('이미지 변환에 실패했습니다.');if(blob.size<=700*1024)break;}if(blob.size>1024*1024)throw Error('압축 사진이 1MB를 넘습니다. 다른 사진으로 테스트하세요.');return blob;}finally{URL.revokeObjectURL(u);}}
$('photo').onchange=()=>run(async()=>{pending=null;const file=$('photo').files[0];if(!file)return;const blob=await compress(file);pending={blob,name:'ouradventure-test-'+crypto.randomUUID()+'.jpg'};if($('preview').dataset.url)URL.revokeObjectURL($('preview').dataset.url);const url=URL.createObjectURL(blob);$('preview').src=url;$('preview').dataset.url=url;$('preview').hidden=false;$('size').textContent='원본 '+Math.round(file.size/1024)+'KB → 업로드 '+Math.round(blob.size/1024)+'KB';status('사진 준비 완료. 원본 파일은 수정하지 않았습니다. 이 테스트는 새로고침하면 미업로드 사진이 사라집니다.');});
$('upload').onclick=()=>run(async()=>{if(!pending||!folder)return;const body=new FormData();body.append('metadata',new Blob([JSON.stringify({name:pending.name,parents:[folder.id],appProperties:{ouradventure:'family-drive-pilot'}})],{type:'application/json'}));body.append('file',pending.blob,pending.name);status('업로드 중…');const f=await(await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name',{method:'POST',body})).json();pending=null;status('Drive 저장 완료: '+f.name+'\n파일 ID: '+f.id+'\n다른 부모 계정에서도 조회되는지 확인하세요.');});
async function showFile(f){if(!f.mimeType?.startsWith('image/'))return;const blob=await(await api('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(f.id)+'?alt=media')).blob();const url=URL.createObjectURL(blob);urls.push(url);const card=document.createElement('article'),title=document.createElement('p'),img=document.createElement('img');title.textContent=f.name;img.alt=f.name;img.src=url;card.append(title,img);$('gallery').append(card);}
$('list').onclick=()=>run(async()=>{clearImages();const q="'"+folder.id.replace(/'/g,"\\'")+"' in parents and trashed = false and mimeType contains 'image/'";let page='',count=0;do{const params=new URLSearchParams({q,fields:'nextPageToken,files(id,name,mimeType)',pageSize:'30',...(page?{pageToken:page}:{})});const result=await(await api('https://www.googleapis.com/drive/v3/files?'+params)).json();for(const f of result.files){await showFile(f);count++;}page=result.nextPageToken||'';}while(page);status('앱 권한으로 조회된 사진 '+count+'장.\n폴더 공유만으로 다른 가족의 모든 사진이 보인다고 가정하지 않습니다. 누락 시 직접 사진 선택을 테스트하세요.');});
$('pickPhotos').onclick=()=>{try{picker(()=>new google.picker.DocsView(google.picker.ViewId.DOCS_IMAGES).setParent(folder.id),data=>{if(data.action!==google.picker.Action.PICKED)return;run(async()=>{clearImages();for(const doc of data.docs){const f=await(await api('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(doc.id)+'?fields=id,name,mimeType')).json();await showFile(f);}status('Picker에서 직접 허용한 사진 조회 완료. 자동 가족 앨범과는 별도 결과입니다.');});});}catch(e){status(e.message);}};
$('disconnect').onclick=()=>{token='';expires=0;folder=null;clearImages();$('folderLabel').textContent='폴더 미선택';status('이 페이지의 Drive 연결을 종료했습니다. Google 계정의 앱 접근 권한 철회는 계정 설정에서 할 수 있습니다.');refresh();};
setInterval(refresh,15000);
</script></html>
